workflows:
  ios-release:
    name: iOS Release (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build unsigned iOS release
        script: |
          flutter build ios --release --no-codesign
      - name: Zip Runner.app for sideloading
        script: |
          cd build/ios/iphoneos
          zip -r -y Runner.app.zip Runner.app
    artifacts:
      - build/ios/iphoneos/Runner.app.zip
